.<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D 5e Campaign Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Metamorphous&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-gold: #b8860b;
            --parchment: #f4e4bc;
            --ink: #2b1d0e;
            --border: 4px ridge var(--gold);
        }

        body {
            font-family: 'MedievalSharp', cursive;
            background-color: #1a1a1a;
            color: var(--ink);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1600px; }
        h1 { color: var(--gold); text-align: center; font-family: 'Metamorphous', serif; text-shadow: 2px 2px black; }

        .admin-panel {
            background: var(--parchment);
            padding: 15px;
            border: var(--border);
            border-radius: 8px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.75em; margin-bottom: 2px; font-weight: bold; }
        input, select, button { padding: 5px; border: 1px solid var(--ink); font-family: 'MedievalSharp', cursive; }

        .character-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 10px; 
            width: 100%;
        }
        
        .char-card {
            background: var(--parchment);
            border: var(--border);
            padding: 8px;
            border-radius: 10px;
            position: relative;
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            font-size: 0.85em;
        }

        .char-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
        .char-token { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--gold); object-fit: cover; background: #333; }

        .stats-container { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }        
        .main-stats { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 4px; 
        }
        .stat-box { 
            text-align: center; 
            border: 1px solid rgba(0,0,0,0.1); 
            padding: 2px; 
            background: rgba(255,255,255,0.3); 
        }

        .mod-tag { font-size: 1.1em; font-weight: bold; color: #8b0000; display: block; }

        .skills-list { 
            min-height: 60px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 5px;
        }
        .buffed { color: var(--dark-gold); font-weight: bold; }
        .section-title { margin-top: 10px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2em; }
        ul { list-style: none; padding: 0; margin: 4px 0; }
        li { display: flex; justify-content: space-between; align-items: center; margin: 2px 0; border-bottom: 1px dotted rgba(0,0,0,0.1); }
        .delete-btn { background: #8b0000; color: white; border: none; padding: 1px 5px; cursor: pointer; border-radius: 4px; font-size: 0.9em; }
        .edit-small { background: #2b1d0e; color: #d4af37; border: 1px solid #d4af37; padding: 1px 4px; cursor: pointer; border-radius: 4px; font-size: 0.75em; margin-right: 4px; }
        .add-small { background: var(--ink); color: var(--gold); border: 1px solid var(--gold); padding: 1px 6px; cursor: pointer; font-size: 0.75em; }

        .coin-gp { color: #ffd700; font-size: 1.2em; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .coin-sp { color: #e0e0e0; font-size: 1.2em; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .coin-cp { color: #cd7f32; font-size: 1.2em; font-weight: bold; text-shadow: 1px 1px 2px #000; }

        .money-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            background: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            text-align: center;
        }
        .inline-edit {
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            padding: 0;
            width: auto;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
        }
        .inline-edit:focus { background: rgba(255,255,255,0.5); outline: none; border-bottom: 1px solid var(--gold); }

        .vitality-row {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.05);
            padding: 5px;
            border-radius: 8px;
        }
        .vit-box { text-align: center; flex: 1; }
        .vit-box label { display: block; font-size: 0.7em; color: #555; text-transform: uppercase; }
        .vit-val { font-size: 1.5em; font-weight: bold; color: #8b0000; }
        .is-buffed-val { color: var(--dark-gold) !important; font-weight: bold; }
        .char-info-large { font-size: 1.1em !important; font-weight: bold; }
        .char-xp-large { font-size: 0.95em !important; color: #555; margin-top: 2px; }

        .dis-tag { 
            color: white; 
            background: #8b0000; 
            padding: 1px 4px; 
            border-radius: 3px; 
            font-size: 0.75em; 
            font-weight: bold; 
            margin-left: 5px;
            text-transform: uppercase;
            vertical-align: middle;
        }

        .equip-category-title {
            font-size: 1.1em;
            color: #555;
            font-style: italic;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            margin-top: 5px;
            margin-bottom: 3px;
        }

        .equip-item {
            cursor: grab;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .equip-item:hover { background: rgba(0,0,0,0.08); }
        .equip-item:active { cursor: grabbing; }

        ul li { font-size: 1.1em; }
        .buffed { font-size: 1.1em; }
        .buffed small { font-size: 0.85em; opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>Grimorio del Dungeon Master</h1>

    <div class="admin-panel">
        <div class="grid-form">
            <div class="form-group"><label>Nome</label><input type="text" id="pName" placeholder="Es. Tordek"></div>
            <div class="form-group"><label>Classe</label><input type="text" id="pClass" placeholder="Guerriero"></div>
            <div class="form-group"><label>Razza</label><input type="text" id="pRace" placeholder="Nano"></div>
            <div class="form-group"><label>Livello</label><input type="number" id="pLevel" value="1"></div>
            <div class="form-group"><label>PF Max</label><input type="number" id="pHP" value="10"></div>
            <div class="form-group"><label>FOR</label><input type="number" id="pSTR" value="10"></div>
            <div class="form-group"><label>DES</label><input type="number" id="pDEX" value="10"></div>
            <div class="form-group"><label>COS</label><input type="number" id="pCON" value="10"></div>
            <div class="form-group"><label>INT</label><input type="number" id="pINT" value="10"></div>
            <div class="form-group"><label>SAG</label><input type="number" id="pWIS" value="10"></div>
            <div class="form-group"><label>CAR</label><input type="number" id="pCHA" value="10"></div>
            <div class="form-group" style="grid-column: span 2;"><label>Token Immagine</label><input type="file" id="pImage" accept="image/*"></div>
            <button onclick="addCharacter()" style="grid-column: span 2; background: var(--ink); color: var(--gold); font-weight: bold;">EVOCA EROE</button>
        </div>
    </div>

    <div id="characterGrid" class="character-grid"></div>
</div>

<script>
    let party = JSON.parse(localStorage.getItem('dnd_ultimate_tracker')) || [];

    // --- LOGICA DI OTTIMIZZAZIONE IMMAGINI ---
    
    async function processImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 150; 
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    function save() {
        try {
            localStorage.setItem('dnd_ultimate_tracker', JSON.stringify(party));
            render();
        } catch (e) {
            console.error("Errore di memoria:", e);
            alert("Attenzione: Lo spazio di archiviazione è esaurito! Prova a eliminare qualche vecchio eroe.");
        }
    }

    // --- DRAG & DROP LOGICA ---
    let draggedItemInfo = null;

    function dragStart(event, charId, index) {
        draggedItemInfo = { charId, index };
        event.target.style.opacity = '0.5';
        if(event.dataTransfer) event.dataTransfer.setData('text/plain', index);
    }

    function dragEnd(event) {
        event.target.style.opacity = '1';
    }

    function dropEquip(event, targetCharId, targetIndex) {
        event.preventDefault();
        if (!draggedItemInfo || draggedItemInfo.charId !== targetCharId) return; // Non permette spostamenti tra personaggi diversi
        
        const sourceIndex = draggedItemInfo.index;
        if (sourceIndex === targetIndex) return;

        const char = party.find(p => p.id === targetCharId);
        const sourceItem = char.equipment[sourceIndex];
        const targetItem = char.equipment[targetIndex];

        // Impedisce di mischiare le categorie
        const getCat = t => t === 'arma' ? 1 : (t === 'armatura' || t === 'scudo' ? 2 : 3);
        if(getCat(sourceItem.type) !== getCat(targetItem.type)) return;

        // Esegue lo spostamento nell'array
        const itemToMove = char.equipment.splice(sourceIndex, 1)[0];
        const newTargetIndex = char.equipment.indexOf(targetItem);
        char.equipment.splice(newTargetIndex, 0, itemToMove);

        draggedItemInfo = null;
        save();
    }

    // --- FUNZIONI DI GESTIONE PERSONAGGIO ---

    async function addCharacter() {
        const file = document.getElementById('pImage').files[0];
        let imgBase64 = "";
        
        if (file) {
            imgBase64 = await processImage(file);
        }

        const char = {
            id: Date.now(),
            name: document.getElementById('pName').value || "Eroe",
            class: document.getElementById('pClass').value || "Classe",
            race: document.getElementById('pRace').value || "Razza",
            level: parseInt(document.getElementById('pLevel').value) || 1,
            proficiency: 2, 
            image: imgBase64,
            baseStats: {
                FOR: parseInt(document.getElementById('pSTR').value) || 10,
                DES: parseInt(document.getElementById('pDEX').value) || 10,
                COS: parseInt(document.getElementById('pCON').value) || 10,
                INT: parseInt(document.getElementById('pINT').value) || 10,
                SAG: parseInt(document.getElementById('pWIS').value) || 10,
                CAR: parseInt(document.getElementById('pCHA').value) || 10,
                PF: parseInt(document.getElementById('pHP').value) || 10
            },
            skills: {}, 
            xp: 0,
            totalMoney: 0,
            equipment: [],
            buffs: []
        };

        party.push(char);
        save();

        document.getElementById('pName').value = "";
        document.getElementById('pImage').value = "";
    }

    // --- FUNZIONI DI CALCOLO E UTILITY ---

    function getDenominations(totalCopper) {
        let remainder = totalCopper;
        const gp = Math.floor(remainder / 100);
        remainder %= 100;
        const sp = Math.floor(remainder / 10);
        const cp = remainder % 10;
        return { gp, sp, cp };
    }

    function updateField(id, field, value) {
        const char = party.find(p => p.id === id);
        char[field] = value;
        save();
    }

    function updateStat(id, stat, value, currentBonus) {
        const char = party.find(p => p.id === id);
        char.baseStats[stat] = (parseInt(value) || 0) - currentBonus;
        save(); 
    }

    function editEquipmentPrompt(id, index) {
        const char = party.find(p => p.id === id);
        if (!char || !char.equipment[index]) return;
        
        const currentItem = char.equipment[index];
        const newName = prompt("Modifica Nome Oggetto:", currentItem.name);
        if (newName === null) return;

        const newValue = prompt("Modifica Quantità / Note (es. x2, 5kg, o lascia vuoto):", currentItem.value || "");
        if (newValue === null) return;

        currentItem.name = newName || "Oggetto";
        currentItem.value = newValue;
        save();
    }

    function getModifier(score) {
        const mod = Math.floor((score - 10) / 2);
        return mod >= 0 ? `+${mod}` : mod;
    }

    function calculate(char, statName) {
        let base = char.baseStats[statName] || 0;
        let bonus = 0;
        let sources = [`Base: ${base}`];

        char.buffs.forEach(b => {
            if (b.stat === statName) {
                bonus += b.value;
                sources.push(`${b.value > 0 ? '+' : ''}${b.value} per via del buff ${b.name}`);
            }
        });

        if (statName === 'CA') {
            const dexScore = char.baseStats['DES'] || 10;
            const dexMod = Math.floor((dexScore - 10) / 2);

            char.equipment.forEach(e => {
                if (e.type === 'armatura') {
                    let armorBase = parseInt(e.value) || 0;
                    let appliedDex = 0;
                    switch(e.dexMode) {
                        case "1": appliedDex = dexMod; break;
                        case "2": appliedDex = Math.min(dexMod, 2); break;
                        case "3": appliedDex = 0; break;
                        case "4": appliedDex = e.manualDex; break;
                        default: appliedDex = 0;
                    }
                    let totalArmorCA = armorBase + appliedDex;
                    let armorBonus = totalArmorCA - base; 
                    bonus += armorBonus;
                    sources.push(`${e.name}: CA ${totalArmorCA} (${e.value} base + ${appliedDex} DES)`);
                } 
                else if (e.type === 'scudo') {
                    let v = parseInt(e.value) || 0;
                    bonus += v;
                    sources.push(`${e.name}: +${v}`);
                }
            });
        }

        return {
            total: base + bonus,
            isBuffed: bonus !== 0,
            tooltip: sources.join(' | ')
        };
    }

    function addSkill(id) {
        const name = prompt("Nome Abilità (es. Intimidire):");
        if (!name) return;

        const choice = prompt("Scegli come calcolare il bonus:\n1: In base a Caratteristica (Auto)\n2: Valore Manuale (Fisso)");
        const char = party.find(p => p.id === id);

        if (choice === "1") {
            const stat = prompt("Caratteristica necessaria (FOR, DES, COS, INT, SAG, CAR):").toUpperCase();
            const validStats = ['FOR', 'DES', 'COS', 'INT', 'SAG', 'CAR'];
            if (validStats.includes(stat)) {
                char.skills[name] = stat;
                save();
            } else {
                alert("Caratteristica non valida!");
            }
        } else if (choice === "2") {
            const val = parseInt(prompt("Inserisci il bonus totale:")) || 0;
            char.skills[name] = val;
            save();
        }
    }

    function addBuff(id) {
        const name = prompt("Fonte:");
        const stat = prompt("Stat (FOR, CA, PF, ecc):").toUpperCase();
        const val = parseInt(prompt("Bonus:"));
        if (name && stat) { 
            party.find(p => p.id === id).buffs.push({ name, stat, value: val }); 
            save(); 
        }
    }

    function updateMoney(id) {
        const char = party.find(p => p.id === id);
        const action = prompt("Cosa vuoi fare? Scrivi 'aggiungi' o 'spendi':").toLowerCase();
        if (action !== 'aggiungi' && action !== 'spendi') return;

        const gp = parseInt(prompt("Monete d'Oro (mo):", 0)) || 0;
        const sp = parseInt(prompt("Monete d'Argento (ma):", 0)) || 0;
        const cp = parseInt(prompt("Monete di Rame (mr):", 0)) || 0;

        const changeInCopper = (gp * 100) + (sp * 10) + cp;
        if (action === 'spendi') {
            if (char.totalMoney < changeInCopper) { alert("Fondi insufficienti!"); return; }
            char.totalMoney -= changeInCopper;
        } else {
            char.totalMoney = (char.totalMoney || 0) + changeInCopper;
        }
        save();
    }

    function addEquip(id) {
        const char = party.find(p => p.id === id);
        const name = prompt("Nome Oggetto:");
        const type = prompt("Tipo (Arma, Armatura, Scudo, Altro):").toLowerCase();
        let val = ""; let toHit = ""; let dexMode = "0"; let manualDex = 0; let stealthDis = false; let useStat = null; 

        if (type === 'arma') {
            const autoStr = confirm("Vuoi aggiungere il bonus FOR al danno?");
            if (autoStr) { val = prompt("Inserisci solo i dadi (es. 1d8):"); useStat = "FOR"; } 
            else {
                const autoDex = confirm("Vuoi aggiungere il bonus DES al danno?");
                if (autoDex) { val = prompt("Inserisci solo i dadi (es. 1d6):"); useStat = "DES"; } 
                else { val = prompt("Inserisci danno completo (es. 1d8+2):"); useStat = null; }
            }
            toHit = prompt("Tiro per colpire (es. +5):");
        } else if (type === 'armatura') {
            val = prompt("CA Base dell'armatura:");
            dexMode = prompt("Calcolo Destrezza?\n1: Piena\n2: Max +2\n3: Nessuna\n4: Manuale");
            if (dexMode === "4") manualDex = parseInt(prompt("Bonus DES manuale:")) || 0;
            stealthDis = confirm("Questa armatura dà svantaggio a Furtività?");
        } else if (type === 'scudo') {
            val = prompt("Bonus CA dello scudo:");
        } else {
            val = prompt("Quantità o Note (es. x2 o lascia vuoto):");
        }

        if (name) {
            char.equipment.push({ name, type, value: val, toHit, dexMode, manualDex, stealthDis, useStat });
            save();
        }
    }

    function deleteItem(id, category, index) {
        party.find(p => p.id === id)[category].splice(index, 1);
        save();
    }

    function deleteSkill(id, skillName) {
        const char = party.find(p => p.id === id);
        if (char && char.skills[skillName] !== undefined) {
            delete char.skills[skillName]; 
            save();
        }
    }

    function removeChar(id) {
        if(confirm("Eliminare l'eroe?")) {
            party = party.filter(p => p.id !== id);
            save();
        }
    }

    function render() {
        const grid = document.getElementById('characterGrid');
        grid.innerHTML = '';

        party.forEach(char => {
            const coins = getDenominations(char.totalMoney || 0);
            const stats = ['FOR', 'DES', 'COS', 'INT', 'SAG', 'CAR'];
            
            const statsHtml = stats.map(s => {
                const c = calculate(char, s);
                const mod = getModifier(c.total);
                const currentBonus = c.total - (char.baseStats[s] || 0);
                return `
                    <div class="stat-box">
                        <small>${s}</small><br>
                        <input type="number" 
                               class="inline-edit vit-val ${c.isBuffed ? 'is-buffed-val' : ''}" 
                               title="${c.isBuffed ? c.tooltip : ''}"
                               style="font-size:1.5em; width:45px; text-align:center;" 
                               value="${c.total}" 
                               onchange="updateStat(${char.id}, '${s}', this.value, ${currentBonus})">
                        <span class="mod-tag">(${mod})</span>
                    </div>`;
            }).join('');

            const currentCA = calculate(char, 'CA');
            const currentHP = calculate(char, 'PF');

            grid.innerHTML += `
                <div class="char-card">
                    <button class="delete-btn" style="position:absolute; top:8px; right:8px;" onclick="removeChar(${char.id})">X</button>
                    
                    <div class="char-header">
                        <img src="${char.image || 'https://via.placeholder.com/60?text=?'}" class="char-token">
                        <div style="flex:1">
                            <input class="inline-edit" style="font-weight:bold; font-size:1.2em; width:100%" 
                                   value="${char.name}" onchange="updateField(${char.id}, 'name', this.value)">
                            
                            <div class="char-info-large">
                                <div>
                                    <input class="inline-edit" style="width:60px" value="${char.race}" onchange="updateField(${char.id}, 'race', this.value)">
                                    <input class="inline-edit" style="width:80px" value="${char.class}" onchange="updateField(${char.id}, 'class', this.value)">
                                </div>
                                <div style="margin-top: 2px;">
                                    Lvl: <input type="number" class="inline-edit" style="width:30px" value="${char.level}" onchange="updateField(${char.id}, 'level', parseInt(this.value))">
                                    | Prof: +<input type="number" class="inline-edit" style="width:30px" value="${char.proficiency || 2}" onchange="updateField(${char.id}, 'proficiency', parseInt(this.value))">
                                </div>
                            </div>
                            
                            <div class="char-xp-large">
                                EXP: <input type="number" class="inline-edit" style="width:80px" value="${char.xp || 0}" onchange="updateField(${char.id}, 'xp', parseInt(this.value))">
                            </div>
                        </div>
                    </div>

                    <div class="vitality-row">
                        <div class="vit-box">
                            <label>PF Max</label>
                            <input type="number" 
                                   class="inline-edit vit-val ${currentHP.isBuffed ? 'is-buffed-val' : ''}" 
                                   title="${currentHP.isBuffed ? currentHP.tooltip : ''}"
                                   style="width:55px; text-align:center" 
                                   value="${currentHP.total}" 
                                   onchange="updateStat(${char.id}, 'PF', this.value, ${currentHP.total - char.baseStats.PF})">
                        </div>
                        <div class="vit-box">
                            <label>CA</label>
                            <input type="number" 
                                   class="inline-edit vit-val ${currentCA.isBuffed ? 'is-buffed-val' : ''}" 
                                   title="${currentCA.isBuffed ? currentCA.tooltip : ''}"
                                   style="width:55px; text-align:center" 
                                   value="${currentCA.total}" 
                                   onchange="updateStat(${char.id}, 'CA', this.value, ${currentCA.total - char.baseStats.CA})">
                        </div>
                    </div>

                    <div class="stats-container">
                        <div class="main-stats">${statsHtml}</div>
                        <div class="section-title">Skill <button class="add-small" onclick="addSkill(${char.id})">+</button></div>
                        <div class="skills-list">
                            <ul>${
                                Object.keys(char.skills).map(s => {
                                    const skillValue = char.skills[s];
                                    let totalSkill;
                                    let displayLabel = "";

                                    if (typeof skillValue === 'string') {
                                        const statTotal = calculate(char, skillValue).total;
                                        const mod = Math.floor((statTotal - 10) / 2);
                                        const prof = parseInt(char.proficiency) || 0;
                                        totalSkill = mod + prof;
                                        displayLabel = skillValue;
                                    } else {
                                        totalSkill = skillValue;
                                        displayLabel = "Man";
                                    }

                                    const formattedTotal = totalSkill >= 0 ? `+${totalSkill}` : totalSkill;
                                    
                                    return `
                                        <li>
                                            <span><b>${s}</b>: ${formattedTotal} <small>(${displayLabel})</small></span>
                                            <button class="delete-btn" onclick="deleteSkill(${char.id}, '${s}')">x</button>
                                        </li>`;
                                }).join('')
                            }</ul>
                        </div>
                    </div>
                    <div class="section-title">Tesoro <button class="add-small" onclick="updateMoney(${char.id})">±</button></div>
                    <div class="money-display">
                        <span class="coin-gp">${coins.gp}mo</span>
                        <span class="coin-sp">${coins.sp}ma</span>
                        <span class="coin-cp">${coins.cp}mr</span>
                    </div>

                    <div class="section-title">Equip <button class="add-small" onclick="addEquip(${char.id})">+</button></div>
                    <div class="equip-category-title">Armi</div>
                    <ul>${char.equipment.filter(e => e.type === 'arma').map((e) => {
                        const originalIndex = char.equipment.indexOf(e);
                        let finalDamage = e.value;
                        if (e.useStat) {
                            const statTotal = calculate(char, e.useStat).total;
                            const mod = Math.floor((statTotal - 10) / 2);
                            const sign = mod >= 0 ? '+' : '-';
                            finalDamage = `${e.value} ${sign} ${Math.abs(mod)}`;
                        }
                        const toolTipText = `Danno: ${finalDamage}${e.toHit ? ', TxC: [' + e.toHit + ']' : ''}`;
                        return `<li class="equip-item" title="${toolTipText}" draggable="true" ondragstart="dragStart(event, ${char.id}, ${originalIndex})" ondragend="dragEnd(event)" ondragover="event.preventDefault()" ondrop="dropEquip(event, ${char.id}, ${originalIndex})">
                            <span><b>${e.name}</b> ${e.toHit ? `[${e.toHit}]` : ''} (${finalDamage})</span> 
                            <div>
                                <button class="delete-btn" onclick="deleteItem(${char.id}, 'equipment', ${originalIndex})">x</button>
                            </div>
                        </li>`;
                    }).join('')}</ul>

                    <div class="equip-category-title">Armature e Scudi</div>
                    <ul>${char.equipment.filter(e => e.type === 'armatura' || e.type === 'scudo').map((e) => {
                        const originalIndex = char.equipment.indexOf(e);
                        const toolTipText = `${e.type === 'armatura' ? 'CA Base: ' : 'Bonus Scudo: '}${e.value}${e.stealthDis ? ' (Svantaggio a Furtività)' : ''}`;
                        return `<li class="equip-item" title="${toolTipText}" draggable="true" ondragstart="dragStart(event, ${char.id}, ${originalIndex})" ondragend="dragEnd(event)" ondragover="event.preventDefault()" ondrop="dropEquip(event, ${char.id}, ${originalIndex})">
                            <span><b>${e.name}</b> (${e.type === 'armatura' ? 'CA ' + e.value : '+' + e.value})${e.stealthDis ? '<span class="dis-tag">DIS</span>' : ''}</span> 
                            <div>
                                <button class="delete-btn" onclick="deleteItem(${char.id}, 'equipment', ${originalIndex})">x</button>
                            </div>
                        </li>`;
                    }).join('')}</ul>
                    
                    <div class="equip-category-title">Altro</div>
                    <ul>${char.equipment.filter(e => e.type !== 'arma' && e.type !== 'armatura' && e.type !== 'scudo').map((e) => {
                        const originalIndex = char.equipment.indexOf(e);
                        const displayValue = e.value ? `<b>${e.value}</b> ` : '';
                        const toolTipText = `Nome: ${e.name}\nQuantità/Note: ${e.value || 'Nessuna'}`;
                        return `<li class="equip-item" title="${toolTipText}" draggable="true" ondragstart="dragStart(event, ${char.id}, ${originalIndex})" ondragend="dragEnd(event)" ondragover="event.preventDefault()" ondrop="dropEquip(event, ${char.id}, ${originalIndex})">
                            <span>${displayValue}${e.name}</span>
                            <div>
                                <button class="edit-small" onclick="editEquipmentPrompt(${char.id}, ${originalIndex})">📝</button>
                                <button class="delete-btn" onclick="deleteItem(${char.id}, 'equipment', ${originalIndex})">x</button>
                            </div>
                        </li>`;
                    }).join('')}</ul>

                    <div class="section-title">Buff <button class="add-small" onclick="addBuff(${char.id})">+</button></div>
                    <ul>${char.buffs.map((b, i) => {
                        const toolTipText = `Modifica ${b.stat} di ${b.value > 0 ? '+' : ''}${b.value}`;
                        return `<li title="${toolTipText}">
                            <span class="buffed">✨ ${b.name} <small>(${b.stat})</small></span> 
                            <button class="delete-btn" onclick="deleteItem(${char.id}, 'buffs', ${i})">x</button>
                        </li>`;
                    }).join('')}</ul>
                </div>
            `;
        });
    }

    render();
</script>

</body>
</html>
